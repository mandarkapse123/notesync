<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Modern Minimal Note & Wave Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Main Sheet -->
    <rect x="20" y="20" width="260" height="260" rx="36" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Stylized Content Lines -->
    <rect x="55" y="70" width="130" height="18" rx="9" fill="#007AFF"/>
    <rect x="55" y="110" width="190" height="12" rx="6" fill="#8E8E93" fill-opacity="0.5"/>
    <rect x="55" y="138" width="160" height="12" rx="6" fill="#8E8E93" fill-opacity="0.5"/>
    
    <!-- Audio Waveform / Quick Capture Pill Badge -->
    <rect x="45" y="185" width="210" height="55" rx="27.5" fill="#F2F2F7"/>
    <!-- Mic Waveform Bars -->
    <rect x="80" y="202" width="6" height="21" rx="3" fill="#5856D6"/>
    <rect x="94" y="196" width="6" height="33" rx="3" fill="#007AFF"/>
    <rect x="108" y="206" width="6" height="13" rx="3" fill="#5856D6"/>
    <rect x="122" y="193" width="6" height="39" rx="3" fill="#007AFF"/>
    <rect x="136" y="200" width="6" height="25" rx="3" fill="#5856D6"/>
    
    <!-- Checkmark Dot -->
    <circle cx="215" cy="212" r="14" fill="#34C759"/>
    <path d="M209 212 L213 216 L221 208" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
